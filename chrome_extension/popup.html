<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Audio &amp; Video Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Downloader</h1>
      <span id="healthBadge" class="health-badge checking" title="Estado del servidor Flask">
        <span class="dot"></span>
        <span id="healthText">Verificando...</span>
      </span>
    </header>

    <div class="field">
      <label for="serverUrlInput">Servidor Flask</label>
      <input type="url" id="serverUrlInput" placeholder="http://127.0.0.1:6001">
    </div>

    <div class="field">
      <label for="directoryInput">Directorio de destino</label>
      <input type="text" id="directoryInput" placeholder="media (por defecto)">
    </div>

    <div class="actions">
      <button type="button" id="youtubeMusicButton" data-service="YouTube Music" data-video="false" title="Descargar MP3 desde YouTube Music">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" fill="currentColor"/>
        </svg>
        <span>YT Music</span>
      </button>

      <button type="button" id="youtubeButton" data-service="YouTube" data-video="false" title="Descargar MP3 desde YouTube">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" fill="currentColor"/>
        </svg>
        <span>YT Audio</span>
      </button>

      <button type="button" id="youtubeVideoButton" data-service="YouTube" data-video="true" title="Descargar MP4 desde YouTube">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z" fill="currentColor"/>
        </svg>
        <span>YT Video</span>
      </button>
    </div>

    <label class="checkbox-row" for="returnDataCheckbox">
      <input type="checkbox" id="returnDataCheckbox">
      <span>Devolver Datos</span>
    </label>

    <div id="statusMessage" class="status" role="status" aria-live="polite"></div>
  </main>

  <script src="popup.js" defer></script>
</body>
</html>
